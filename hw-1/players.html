<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Статистика футболистов KickBoard">
    <title>KickBoard — Игроки</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="players">
<div class="app">
    <aside class="sidebar">
        <a class="brand" href="index.html">
            <span class="brand__mark">KB</span>
            <span class="brand__name">KickBoard</span>
        </a>

        <nav class="navigation" aria-label="Основная навигация">
            <ul class="navigation__list">
                <li>
                    <a class="navigation__link" href="index.html">
                        <span class="navigation__icon">⌂</span>
                        <span class="navigation__text">Обзор</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link" href="matches.html">
                        <span class="navigation__icon">⚽</span>
                        <span class="navigation__text">Матчи</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link" href="standings.html">
                        <span class="navigation__icon">▤</span>
                        <span class="navigation__text">Таблица</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link" href="match.html">
                        <span class="navigation__icon">◉</span>
                        <span class="navigation__text">Матч</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link navigation__link--active"
                       href="players.html"
                       aria-current="page">
                        <span class="navigation__icon">★</span>
                        <span class="navigation__text">Игроки</span>
                    </a>
                </li>
            </ul>
        </nav>

        <p class="sidebar__note">
            Футбольный дашборд
        </p>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <p class="topbar__eyebrow">Статистика сезона</p>
                <h1 class="topbar__title">Лучшие игроки</h1>
            </div>

            <div class="profile">
                <span class="profile__avatar">С</span>
                <div class="profile__info">
                    <p class="profile__name">Семён</p>
                    <p class="profile__role">Болельщик</p>
                </div>
            </div>
        </header>

        <p class="page-description">
            Карточки игроков и индивидуальная статистика.
            
        </p>

        <form class="search-form" data-js="player-search-form">
            <label class="search-form__label" for="player-search">Поиск игрока или клуба</label>
            <div class="search-form__row">
                <input
                    class="search-form__input"
                    id="player-search"
                    type="search"
                    placeholder="Например, Arsenal"
                    autocomplete="off"
                    data-js="player-search-input"
                >
                <button class="button search-form__button" type="submit">Найти</button>
            </div>
            <p class="search-form__message" aria-live="polite" data-js="player-search-message"></p>
        </form>

        <section class="players-grid" aria-label="Список лучших игроков" data-js="players-list"></section>

        <footer class="footer">
            KickBoard
        </footer>
    </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
