<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Расписание футбольных матчей KickBoard">
    <title>KickBoard — Матчи</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="matches">
<div class="app">
    <aside class="sidebar">
        <a class="brand" href="index.html">
            <span class="brand__mark">KB</span>
            <span class="brand__name">KickBoard</span>
        </a>

        <nav class="navigation" aria-label="Основная навигация">
            <ul class="navigation__list">
                <li>
                    <a class="navigation__link" href="index.html">
                        <span class="navigation__icon">⌂</span>
                        <span class="navigation__text">Обзор</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link navigation__link--active"
                       href="matches.html"
                       aria-current="page">
                        <span class="navigation__icon">⚽</span>
                        <span class="navigation__text">Матчи</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link" href="standings.html">
                        <span class="navigation__icon">▤</span>
                        <span class="navigation__text">Таблица</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link" href="match.html">
                        <span class="navigation__icon">◉</span>
                        <span class="navigation__text">Матч</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link" href="players.html">
                        <span class="navigation__icon">★</span>
                        <span class="navigation__text">Игроки</span>
                    </a>
                </li>
            </ul>
        </nav>

        <p class="sidebar__note">
            Футбольный дашборд
        </p>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <p class="topbar__eyebrow">Расписание</p>
                <h1 class="topbar__title">Матчи</h1>
            </div>

            <div class="profile">
                <span class="profile__avatar">С</span>
                <div class="profile__info">
                    <p class="profile__name">Семён</p>
                    <p class="profile__role">Болельщик</p>
                </div>
            </div>
        </header>

        <p class="page-description">
            Следите за ближайшими играми и результатами завершённых матчей.
        </p>

        <div class="filters" aria-label="Выбор даты">
            <button class="filter" type="button" data-match-filter="yesterday">Вчера</button>
            <button class="filter filter--active" type="button" data-match-filter="today">Сегодня</button>
            <button class="filter" type="button" data-match-filter="tomorrow">Завтра</button>
            <button class="filter" type="button" data-match-filter="all">Все</button>
        </div>

        <div data-js="matches-list"></div>

        <footer class="footer">
            KickBoard 
        </footer>
    </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
