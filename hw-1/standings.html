<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Турнирная таблица футбольных команд KickBoard">
    <title>KickBoard — Таблица</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="standings">
<div class="app">
    <aside class="sidebar">
        <a class="brand" href="index.html">
            <span class="brand__mark">KB</span>
            <span class="brand__name">KickBoard</span>
        </a>

        <nav class="navigation" aria-label="Основная навигация">
            <ul class="navigation__list">
                <li>
                    <a class="navigation__link" href="index.html">
                        <span class="navigation__icon">⌂</span>
                        <span class="navigation__text">Обзор</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link" href="matches.html">
                        <span class="navigation__icon">⚽</span>
                        <span class="navigation__text">Матчи</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link navigation__link--active"
                       href="standings.html"
                       aria-current="page">
                        <span class="navigation__icon">▤</span>
                        <span class="navigation__text">Таблица</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link" href="match.html">
                        <span class="navigation__icon">◉</span>
                        <span class="navigation__text">Матч</span>
                    </a>
                </li>

                <li>
                    <a class="navigation__link" href="players.html">
                        <span class="navigation__icon">★</span>
                        <span class="navigation__text">Игроки</span>
                    </a>
                </li>
            </ul>
        </nav>

        <p class="sidebar__note">
            Футбольный дашборд  
        </p>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <p class="topbar__eyebrow" data-js="standings-league">Premier League</p>
                <h1 class="topbar__title">Турнирная таблица</h1>
            </div>

            <div class="profile">
                <span class="profile__avatar">С</span>
                <div class="profile__info">
                    <p class="profile__name">Семён</p>
                    <p class="profile__role">Болельщик</p>
                </div>
            </div>
        </header>

        <p class="page-description">
        </p>

        <div class="filters" aria-label="Выбор лиги">
            <button class="filter filter--active" type="button" data-league-id="premier-league" aria-pressed="true">Premier League</button>
            <button class="filter" type="button" data-league-id="la-liga" aria-pressed="false">La Liga</button>
            <button class="filter" type="button" data-league-id="serie-a" aria-pressed="false">Serie A</button>
            <button class="filter" type="button" data-league-id="bundesliga" aria-pressed="false">Bundesliga</button>
        </div>

        <form class="search-form" data-js="team-search-form">
            <label class="search-form__label" for="team-search">Поиск команды</label>
            <div class="search-form__row">
                <input
                    class="search-form__input"
                    id="team-search"
                    type="search"
                    placeholder="Например, Arsenal"
                    autocomplete="off"
                    data-js="team-search-input"
                >
                <button class="button search-form__button" type="submit">Найти</button>
            </div>
        </form>

        <section class="card">
            <div class="section-heading">
                <h2 class="section-heading__title">Таблица команд</h2>
                <span class="badge">18 туров</span>
            </div>

            <div class="table-wrapper">
                <table class="standings-table">
                    <thead>
                    <tr>
                        <th>№</th>
                        <th>Команда</th>
                        <th>И</th>
                        <th>В</th>
                        <th>Н</th>
                        <th>П</th>
                        <th>Мячи</th>
                        <th>Форма</th>
                        <th>О</th>
                    </tr>
                    </thead>

                    <tbody data-js="standings-body"></tbody>
                </table>
            </div>
        </section>

        <footer class="footer">
            KickBoard
        </footer>
    </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
